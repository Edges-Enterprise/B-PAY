<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 400"
     width="200" height="400"
     role="img"
     aria-labelledby="bpayLightningTitle"
     preserveAspectRatio="xMidYMid meet"
     style="display:block;">
  <title id="bpayLightningTitle">B-PAY Animated Lightning</title>

  <defs>
    <!-- Brand gradient: neon green → gold -->
    <linearGradient id="bp-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF7F"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="g1"/>
      <feMerge>
        <feMergeNode in="g1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      :root { --strike-duration: 420ms; }

      .bolt, .branch {
        fill: none;
        stroke-linejoin: round;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      .bolt-glow {
        stroke: url(#bp-gradient);
        stroke-width: 12;
        opacity: 0.95;
        filter: url(#glow);
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: strike var(--strike-duration) cubic-bezier(.2,.8,.2,1) forwards,
                   glow-fade 1300ms ease-in 140ms forwards;
      }

      .bolt-core {
        stroke: url(#bp-gradient);
        stroke-width: 6;
        filter: url(#innerGlow);
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: strike var(--strike-duration) cubic-bezier(.2,.8,.2,1) forwards,
                   flicker-main 900ms linear 120ms infinite;
      }

      .bolt-accent {
        stroke: #C8FFE5;
        stroke-width: 3;
        mix-blend-mode: screen;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        opacity: 0.85;
        animation: strike var(--strike-duration) cubic-bezier(.2,.8,.2,1) forwards;
      }

      .branch {
        stroke: #C8FFE5;
        stroke-width: 3;
        opacity: 0.0;
        stroke-dasharray: 500;
        stroke-dashoffset: 500;
        animation: branch-strike 360ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .branch.glow {
        stroke: url(#bp-gradient);
        stroke-width: 7;
        filter: url(#glow);
        opacity: 0.0;
        stroke-dasharray: 500;
        stroke-dashoffset: 500;
        animation: branch-strike 360ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .branch.delay-1 { animation-delay: 90ms; }
      .branch.delay-2 { animation-delay: 160ms; }
      .branch.glow.delay-1 { animation-delay: 95ms; }
      .branch.glow.delay-2 { animation-delay: 165ms; }

      @keyframes strike {
        0%   { stroke-dashoffset: 1000; opacity: 0.0; transform: translateY(-10px) }
        35%  { stroke-dashoffset: 220; opacity: 1.0; transform: translateY(4px) }
        75%  { stroke-dashoffset: 12; opacity: 1.0; transform: translateY(0px) }
        100% { stroke-dashoffset: 0; opacity: 1.0; transform: translateY(0px) }
      }

      @keyframes branch-strike {
        0%   { stroke-dashoffset: 500; opacity: 0.0; transform: translateY(-6px) }
        40%  { stroke-dashoffset: 90; opacity: 1.0; transform: translateY(2px) }
        85%  { stroke-dashoffset: 6; opacity: 1.0; transform: translateY(0px) }
        100% { stroke-dashoffset: 0; opacity: 1.0; }
      }

      @keyframes glow-fade {
        0%   { opacity: 0.95; }
        80%  { opacity: 0.25; }
        100% { opacity: 0.1; }
      }

      @keyframes flicker-main {
        0%,100% { opacity: 1; transform: scale(1) }
        20% { opacity: 0.8; transform: scale(1.02) }
        40% { opacity: 1; transform: scale(0.995) }
        60% { opacity: 0.85; transform: scale(1.01) }
      }
    </style>
  </defs>

  <!-- Main bolt -->
  <path class="bolt bolt-glow"
        d="M100 6 L78 110 L108 110 L68 210 L110 160 L86 260 L140 140 L108 320 L160 220" />
  <path class="bolt bolt-accent"
        d="M100 10 L82 110 L108 112 L72 200 L110 162 L88 254 L140 144 L110 318 L156 226" />
  <path class="bolt bolt-core"
        d="M100 6 L78 110 L108 110 L68 210 L110 160 L86 260 L140 140 L108 320 L160 220" />

  <!-- Branches -->
  <path class="branch glow delay-1"
        d="M88 120 L54 98 L30 142" />
  <path class="branch delay-1"
        d="M88 120 L54 98 L30 142" />
  <path class="branch glow delay-2"
        d="M118 160 L146 130 L176 152" />
  <path class="branch delay-2"
        d="M118 160 L146 130 L176 152" />
</svg>
